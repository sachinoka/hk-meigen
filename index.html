<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .quote-box {
            background-color: #f1f1f0; /* Notionの背景に馴染むグレー */
            border-radius: 8px;
            padding: 18px 22px;
            color: #37352F;
            font-size: 14px;
            line-height: 1.6;
            box-sizing: border-box;
            width: 100%;
        }
        .quote-main {
            font-weight: 500;
            margin-bottom: 6px;
        }
        .quote-sub {
            font-size: 13px;
            color: #787774;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="quote-box">
    <div class="quote-main" id="mainText">読み込み中...</div>
    <div class="quote-sub" id="subText"></div>
</div>

<script>
    // 送っていただいた言葉のリスト
    const quotes = [
        { main: "ふんわり柔らかい雰囲気の纏い方", sub: "こう扱われるべきとか、そういう期待をしない。頑固にならない事が歳を重ねるほど大事。" },
        { main: "自分に期待しすぎない。“そんなもん”って割り切る", sub: "高く見積もりすぎないとも言うか。“まあ、そんなもんだよね”ってある程度割り切ることも必要。“そんな自分でも結構頑張ってるじゃん”って思えてくる。" },
        { main: "あまり気が合わない人は“こういう人いるよね”リストに入れちゃう", sub: "“この人あの人と一緒だな”って自分の中のリストに入れちゃう。データを集めていく感覚で、なんとなく攻略法が見えてくる。" },
        { main: "やりたいことを叶えるためには", sub: "大きな目標を立てずに、その時の気持ちやニーズに合わせて積み重ねていく。" },
        { main: "まず着ることが大事。", sub: "そうしないと一生その服とは縁がないから。着てみて現実を知ることがボディメイクの第1歩。" },
        { main: "自分で決める経験を積み重ねると自信がつく", sub: "“これ！”ってものに辿り着くまではいわばすべてが失敗。でもそのプロセスを踏む経験も大事。" },
        { main: "自分の道が分からないときは", sub: "“私ができることで人が喜んでくれることは何かな？”って考えてみるのもひとつの手。" },
        { main: "ブランドを持ってる以上、自信を持って意思決定したい", sub: "私も最初から自信があるわけじゃないよ。" },
        { main: "フットワークは軽く", sub: "新しい出会いを楽しむ。" },
        { main: "ジンクスは作らない", sub: "自分で自分をしばりたくない。いつでも色んな場面や物事に対応できる柔軟な人でいたいから。" },
        { main: "戦わずして勝つ", sub: "“結果、おいしいね”って最後に言えるのがいつも理想。仕事も人間関係も、恋愛も。" },
        { main: "外出する時は赤リップ", sub: "" },
        { main: "自虐的な発言はしない", sub: "コンプレックスを曝け出すとそこばかり注目が集まるし、“そんな風に扱っていい人”と思われるから極力しない。" },
        { main: "自分はラッキーだと信じる", sub: "“絶対に勝つ！”と思い込むと本当にその通りになる。人生も同じ、生まれながらにラッキーと暗示をかける。" },
        { main: "焦りはブス", sub: "" },
        { main: "何事にも期待しすぎず、嘆くよりも適応していく", sub: "最初から期待値は低めに。無駄に背負わない。" },
        { main: "自分らしさ＝経験をカスタマイズして作るもの", sub: "自分の好きを重ねていくことが大事。" },
        { main: "口角を上げておく", sub: "話しかけられやすい雰囲気を作るために常に心がけていますね。" },
        { main: "自分を理解して自信を持てるようになると", sub: "人にも優しくできるし周りとのコミュニケーションも変わってくる。" },
        { main: "可愛げで得をする", sub: "モテるよりも仕事で無理を聞いてもらったり、丁寧に接してもらえたり。お返しもきちんとする。" },
        { main: "受けた好意は絶対に無駄にしない", sub: "甘えるだけでなく、きちんとお返しすることも大切。" },
        { main: "“大人の可愛い”には物事を好転させるポジティブな力がある", sub: "" },
        { main: "何があってもイライラしたり、悲壮感を漂わせない", sub: "ピリピリしていても表に出さない。大人だから、ネガティブな感情は外に出しません。" },
        { main: "時には委ねることも大事", sub: "すべてを一人でやろうと思うと大変すぎてギスギスしちゃう。無駄に背負わないことで、まとう空気がまろやかに。" },
        { main: "どんな事態も“そうだよね”でひとまず受け止める", sub: "そうやって一旦置くことで自分の中で消化できる。" },
        { main: "予定通りに行かないことに腹を立てるより", sub: "次の策を考えて動くのが1番効率いい。" },
        { main: "今ある環境でなにができるか、それだけを考えて進んできた", sub: "“ここでもっとできることはないか”って考える癖がついている。" },
        { main: "今の自分の実力を見極めて今の環境で自分をアプデする", sub: "それを積み重ねることが大事。" },
        { main: "短時間でもいいから必ず湯船に浸かる", sub: "" },
        { main: "自分自身を常にアップデートする", sub: "40代に向けて種をまくフェーズ。好きな道が選べるように色んな選択肢を育てておく。" },
        { main: "関わっていて楽しい、面白いって思われる人でいるために", sub: "多方面にアンテナを張っていたい。" },
        { main: "“これじゃなきゃダメ！”をつくらない", sub: "柔軟でいればいるほど素敵なものが入ってくる。メイクも服も自分らしさ7割で残りは余白に。" },
        { main: "いい意味でミーハーでいる", sub: "流行には常にアンテナを張る。大人だからと興味の幅を狭めず“可愛い”はどんどん取り入れる。" },
        { main: "好奇心を持ち続ける", sub: "SNSで話題になるモノは必ずチェック。気になったら追いまくる。" },
        { main: "きゅん♡する瞬間を意識する", sub: "何に触れるか、どんな気持ちで過ごすかは大事。常に“きゅん♡”を全力摂取。" },
        { main: "ギャップは最高の掴み", sub: "ハイブラだけで固めるよりも、ちいかわを一緒に持つみたいなギャップは常に意識する。" }
    ];

    // ランダムに1つ選んで表示
    const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
    document.getElementById('mainText').textContent = randomQuote.main;
    
    const subElement = document.getElementById('subText');
    if (randomQuote.sub) {
        subElement.textContent = randomQuote.sub;
        subElement.style.display = 'block';
    } else {
        subElement.style.display = 'none';
    }
</script>

</body>
</html>
