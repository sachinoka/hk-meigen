<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meigen Widget</title>
    <style>
        /* 周りの不要な余白を完全にゼロにする設定 */
        html, body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            overflow: hidden;
        }
        .card {
            background-color: #f4f4f4;
            border-radius: 8px;
            padding: 12px 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #333333;
            box-sizing: border-box;
        }
        .title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.4;
        }
        .sub {
            font-size: 12px;
            color: #666666;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title" id="quote-title">読み込み中...</div>
        <div class="sub" id="quote-sub"></div>
    </div>

    <script>
        const quotes = [
            { title: "きゅん♡する瞬間を意識する", sub: "何に触れるか、どんな気持ちで過ごすかは大事。常に”きゅん♡”を全力摂取。" }
            // ※ここにあなたが入れた36項目のリストが続きます
        ];

        function showRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            const selected = quotes[randomIndex];
            
            document.getElementById('quote-title').textContent = selected.title;
            
            const subElement = document.getElementById('quote-sub');
            if (selected.sub) {
                subElement.textContent = selected.sub;
                subElement.style.display = 'block';
            } else {
                subElement.style.display = 'none';
            }
        }

        showRandomQuote();
    </script>
</body>
</html>
